# Input/Output paths
reads_dir: "[Input Read Directory]"
results_dir: "[Output Directory]"
reference: "[Genome file path]"

# Intervals for parallelization
chromosome_prefix: "[Chromosome start pattern]"
contig_prefix: "[Contig start pattern]"

# Sex identification patterns
male_pattern: "[pattern]"
female_pattern: "[pattern]"

# Binaries
software_dir: "[kmersGWAS/KMC binaries directory]"
scripts_dir: "[scripts directory]"
# kmc_tools is part of the KMC3 distribution, not of the kmersGWAS helper
# binaries. Defaults to <software_dir>/kmc_tools; override if it lives elsewhere.
#kmc_tools: "/path/to/kmc/bin/kmc_tools"
# MEGAHIT (rule megahit_sexspecific, 10_kmer_bb.smk) is not a kmersGWAS
# helper binary either. Defaults to the hard-coded path in that module;
# override if it lives elsewhere.
#megahit: "/path/to/megahit"

# Sex-specific k-mer set operations (rule sex_specific_kmers)
# kmer_min_present: min copies for a k-mer to count as PRESENT in the sex it
#                   is specific to (intersection side). Raising it is the way
#                   to make the call stricter; it is bounded by the coverage
#                   of the LOWEST-coverage sample of that sex, since every
#                   sample must clear it.
# kmer_max_present: upper bound that drops satellite/repeat derived k-mers.
#                   Applied to the MINIMUM count across the present group,
#                   not per sample: counts of 6/7/8/36 across four males
#                   keep the k-mer (minimum 6), while a satellite that is
#                   high in every male does not. Set to 0 to disable. Never
#                   applied to the subtraction side (see the rule docstring).
# kmer_min_absent:  min copies for a k-mer to count as present in the other
#                   sex, i.e. enough to disqualify it (subtraction side).
#                   Keep at 1: a single read is enough to veto specificity.
#                   Raising this LOOSENS the call, it does not tighten it.
# All three are counts of a single oriented k-mer in the -b (both strands)
# database, i.e. roughly half the depth of the underlying locus.
kmer_min_present: 5
kmer_max_present: 30
kmer_min_absent: 1

# ABySS assembly of the sex-specific k-mers (rule abyss_sex)
# abyss_k:        assembly k, must be < 31. Lower bridges wider holes in the
#                 k-mer tiling (longer, less fragmented contigs) at the cost
#                 of joining k-mers that share only abyss_k bases. Try 21 if
#                 the assembly comes back fragmented.
# abyss_coverage: -c, drop contigs below this mean coverage. Leave at 0: the
#                 counts here are set-operation minima, not read coverage.
# abyss_erode:    -e, erode contig ends below this coverage. 0 = off.
# abyss_trim:     -t, longest dangling edge to trim. 0 keeps tips as their
#                 own contigs rather than discarding them.
abyss_k: 25
abyss_coverage: 0
abyss_erode: 0
abyss_trim: 0

# =============================================================================
# RNA-seq differential expression (rules 13-14, target `de_all`)
# =============================================================================
# Reads are expected to be already downloaded.
# One directory per sample (symlinks are fine), holding {name}_1.fq.gz and
# {name}_2.fq.gz, like reads_dir. The directory names are the sample names the
# design files below must refer to.
rna_reads_dir: "[RNAseq reads directory]"
rna_genome: "[Genome fasta the transcriptome is extracted from]"
rna_gff: "[GFF annotation matching rna_genome]"

# Bases cut from the 5' end of both mates (was HEADCROP:12 in Trimmomatic)
rna_trim_front: 12

# Transcript annotation, tab separated, one line per transcript, with the
# columns: gid, gname, gproduct, chr, chr_id, start, end, length.
# The effective length is added by the pipeline from the Salmon output.
rna_annotation: "[Transcript annotation table]"

# Directory holding {analysis}_design.txt and {analysis}_matrix.txt, and the
# analyses to run (one edgeR run each)
de_input_dir: "[DE design directory]"
de_analyses: ["[analysis name]"]

# edgeR settings: FDR threshold, test to use, whether to draw the heatmaps
de_fdr: 0.05
de_filtering: "fdr"
de_heatmaps: "yes"

# Module providing edgeR/limma/gplots/dynamicTreeCut on your cluster
bioconductor_module: "R-bundle-Bioconductor/3.18-foss-2023a-R-4.3.2"
